name: Deploy MMS to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          # Same-origin API on the VPS (empty = relative /api)
          VITE_API_URL: ""

      - name: Install backend deps
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            SITE="${{ secrets.VPS_SITE_PATH }}"
            cd "$SITE"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm ci
            npm run build
            cd server
            npm ci
            npx prisma generate
            npx prisma db push
            npm run build
            cd ..
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart mms-api --update-env || pm2 start server/dist/index.js --name mms-api --cwd "$SITE/server"
              pm2 save
            fi
            curl -sf "http://127.0.0.1:3001/api/health" || true
