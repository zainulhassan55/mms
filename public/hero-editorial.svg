<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none" role="img" aria-label="Editorial workflow illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f6fa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a2b3c" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="820" cy="120" r="90" fill="#1a2b3c" fill-opacity="0.04"/>
  <circle cx="120" cy="600" r="120" fill="#1f4f78" fill-opacity="0.05"/>

  <!-- desk surface -->
  <rect x="70" y="470" width="820" height="18" rx="4" fill="#cbd5e1"/>
  <rect x="70" y="488" width="820" height="8" rx="2" fill="#94a3b8" fill-opacity="0.45"/>

  <!-- main manuscript panel -->
  <g filter="url(#soft)">
    <rect x="160" y="120" width="420" height="340" rx="18" fill="url(#panel)" stroke="#e2e8f0"/>
    <rect x="190" y="155" width="180" height="14" rx="7" fill="#1a2b3c"/>
    <rect x="190" y="185" width="280" height="8" rx="4" fill="#94a3b8" fill-opacity="0.55"/>
    <rect x="190" y="205" width="310" height="8" rx="4" fill="#94a3b8" fill-opacity="0.35"/>
    <rect x="190" y="225" width="250" height="8" rx="4" fill="#94a3b8" fill-opacity="0.35"/>
    <rect x="190" y="260" width="340" height="1" fill="#e2e8f0"/>
    <rect x="190" y="285" width="320" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="190" y="305" width="300" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="190" y="325" width="330" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="190" y="345" width="260" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="190" y="375" width="110" height="32" rx="8" fill="#1a2b3c"/>
    <rect x="316" y="375" width="110" height="32" rx="8" fill="#e2e8f0"/>
  </g>

  <!-- side review card -->
  <g filter="url(#soft)">
    <rect x="620" y="170" width="250" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="645" y="198" width="90" height="10" rx="5" fill="#1f4f78"/>
    <rect x="645" y="226" width="200" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="645" y="246" width="170" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="645" y="278" width="200" height="46" rx="10" fill="#eef4f9" stroke="#d9e6f2"/>
    <rect x="645" y="340" width="200" height="46" rx="10" fill="#eef4f9" stroke="#d9e6f2"/>
  </g>

  <!-- floating status chips -->
  <g filter="url(#soft)">
    <rect x="520" y="95" width="150" height="42" rx="21" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="545" cy="116" r="6" fill="#1f4f78"/>
    <rect x="562" y="110" width="88" height="10" rx="5" fill="#64748b"/>
  </g>
  <g filter="url(#soft)">
    <rect x="680" y="450" width="170" height="42" rx="21" fill="#1a2b3c"/>
    <rect x="705" y="466" width="120" height="10" rx="5" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
