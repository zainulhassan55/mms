<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Editorial workspace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3f3a"/>
      <stop offset="45%" stop-color="#0e5c54"/>
      <stop offset="100%" stop-color="#082f2c"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c4a574" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#warm)"/>
  <!-- distant shelves -->
  <g opacity="0.22" fill="#061a18">
    <rect x="40" y="180" width="28" height="520" rx="2"/>
    <rect x="78" y="210" width="22" height="490" rx="2"/>
    <rect x="110" y="160" width="34" height="540" rx="2"/>
    <rect x="154" y="230" width="18" height="470" rx="2"/>
    <rect x="182" y="190" width="30" height="510" rx="2"/>
    <rect x="1380" y="200" width="26" height="500" rx="2"/>
    <rect x="1416" y="170" width="32" height="530" rx="2"/>
    <rect x="1458" y="220" width="20" height="480" rx="2"/>
    <rect x="1488" y="185" width="36" height="515" rx="2"/>
    <rect x="1534" y="240" width="24" height="460" rx="2"/>
  </g>
  <!-- desk plane -->
  <path d="M0 620 L1600 560 L1600 900 L0 900 Z" fill="#061916" opacity="0.55"/>
  <path d="M120 640 L760 610 L820 720 L80 760 Z" fill="#0b2e2a" opacity="0.85"/>
  <!-- manuscript stack -->
  <g transform="translate(220 560)">
    <rect x="0" y="40" width="220" height="14" rx="2" fill="#e8eef0" opacity="0.9"/>
    <rect x="8" y="24" width="220" height="14" rx="2" fill="#d5e4e1" opacity="0.85"/>
    <rect x="16" y="8" width="220" height="14" rx="2" fill="#f3f7f8" opacity="0.95"/>
    <rect x="28" y="-4" width="180" height="8" rx="1" fill="#9eb8b4" opacity="0.5"/>
  </g>
  <!-- open journal -->
  <g transform="translate(980 500)">
    <path d="M0 40 L160 10 L160 190 L0 210 Z" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <path d="M160 10 L330 40 L330 210 L160 190 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.18"/>
    <line x1="28" y1="70" x2="130" y2="55" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="30" y1="95" x2="128" y2="80" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
    <line x1="32" y1="120" x2="120" y2="108" stroke="#fff" stroke-opacity="0.15" stroke-width="2"/>
    <line x1="190" y1="55" x2="300" y2="72" stroke="#fff" stroke-opacity="0.22" stroke-width="2"/>
    <line x1="188" y1="80" x2="298" y2="96" stroke="#fff" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <!-- soft light bloom -->
  <circle cx="1180" cy="220" r="180" fill="#2bb5a3" opacity="0.12"/>
  <circle cx="420" cy="280" r="120" fill="#ffffff" opacity="0.05"/>
</svg>
